version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cardflow
      POSTGRES_PASSWORD: cardflow
      POSTGRES_DB: cardflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://cardflow:cardflow@postgres:5432/cardflow
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
